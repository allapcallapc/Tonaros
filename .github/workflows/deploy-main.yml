name: Deploy main preview

# Continuously redeploys the tip of main to a "staging" preview at
# /main/ on gh-pages, separate from the release-triggered production
# deploy at the root and from per-PR previews at /pr-<n>/.
on:
  push:
    branches: [main]

# Only the newest main matters, so a newer push supersedes an older run.
# Kept separate from the other deploy workflows - see deploy.yml.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: staging
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        uses: ./.github/actions/generate-app-icons
        with:
          platform: web

      - name: Determine preview version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "name=${BASE_VERSION}-main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build web app
        # env/staging.json sets APP_ENV=staging, which shows a "STAGING"
        # corner banner - see env/README.md.
        run: |
          flutter build web --base-href "/${{ github.event.repository.name }}/main/" \
            --build-name=${{ steps.version.outputs.name }} --build-number=0 \
            --dart-define-from-file=env/staging.json

      - name: Deploy to gh-pages
        uses: ./.github/actions/publish-gh-pages
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          source_dir: build/web
          destination_dir: main
          commit_message: 'deploy: main @ ${{ github.sha }}'
